<!DOCTYPE html>
<html>
<head>
    <title>Human Verification</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <script src="https://openfpcdn.io/fingerprintjs/v4"></script>
</head>
<body style="background: #1a1a1a; color: white; text-align: center; font-family: sans-serif;">
    <div id="content" style="margin-top: 50px;">
        <h3 id="status-text">Verifying Connection...</h3>
        <div id="loader">Processing Device Fingerprint...</div>
    </div>

    <script>
        const tg = window.Telegram.WebApp;
        tg.expand();
        tg.ready();

        async function processVerification() {
            try {
                // 1. Load Fingerprint
                const fp = await FingerprintJS.load();
                const result = await fp.get();
                const fingerprint = result.visitorId; 

                // 2. Strict Identity Detection
                // tg.initDataUnsafe.bot?.username se clone bot ka asli username uthayega
                const currentBotUsername = tg.initDataUnsafe.bot?.username;
                
                // 3. Backend Verification Call
                const response = await fetch('/verify-fingerprint', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({
                        fingerprint: fingerprint,
                        initData: tg.initData,
                        batch_id: new URLSearchParams(window.location.search).get('batch_id'),
                        bot_username: currentBotUsername // Sending strict identity to backend
                    })
                });

                if (!response.ok) {
                    throw new Error("Network response was not ok");
                }

                const data = await response.json();

                if(data.status === "ok") {
                    // Success: Redirect to Linkshortener
                    document.getElementById("status-text").innerText = "Redirecting...";
                    window.location.href = data.redirect_url;
                } else {
                    // Security Alert: Bypass Detected
                    document.body.innerHTML = `<h3 style="color: #ff4d4d;">Security Alert!</h3><p>${data.message}</p>`;
                    setTimeout(() => { tg.close(); }, 3000);
                }

            } catch (error) {
                console.error("Verification Error:", error);
                alert("Something went wrong. Please ensure you are using the official Telegram App and try again.");
                tg.close();
            }
        }

        // Start the process
        processVerification();
    </script>
</body>
</html>
