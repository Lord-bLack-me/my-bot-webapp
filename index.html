<!DOCTYPE html>
<html>
<head>
    <title>Human Verification</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <script src="https://openfpcdn.io/fingerprintjs/v4"></script>
</head>
<body style="background: #1a1a1a; color: white; text-align: center; font-family: sans-serif;">
    <h3>Verifying Connection...</h3>
    <div id="loader">Processing Fingerprint...</div>

    <script>
        const tg = window.Telegram.WebApp;
        tg.expand();

        async function processVerification() {
            const fp = await FingerprintJS.load();
            const result = await fp.get();
            const fingerprint = result.visitorId; // Unique Device ID

            // Bot ko data bhejna (Back-end verification ke liye)
            const initData = tg.initData;
            
            const response = await fetch('/verify-fingerprint', {
                method: 'POST',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify({
                    fingerprint: fingerprint,
                    initData: tg.initData,
                    batch_id: new URLSearchParams(window.location.search).get('batch_id'),
                    // Dynamic username logic added for Clones
                    bot_username: tg.initDataUnsafe.bot?.username || "YourMainBotUsername"
                })
            });

            const data = await response.json();
            if(data.status === "ok") {
                // Linkshortener par redirect karna
                window.location.href = data.redirect_url;
            } else {
                alert("Bypass Detected! Please use the bot again.");
                tg.close();
            }
        }
        processVerification();
    </script>
</body>
</html>
